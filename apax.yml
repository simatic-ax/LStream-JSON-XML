# General information
name: "@simatic-ax/lstream"
version: 0.0.0-placeholder
type: lib
keywords:
  - library
  - tiax
author: Siemens
# Description will be displayed in the apax extension
description: Library for Serializing and Deserializing XML and JSON files for TIA Portal 19^ and SIMATIC AX
# Targets which will be compiled with 'apax build' 
repository:
  type: "git"
  url: "https://github.com/simatic-ax/LStream-JSON-XML"
targets:
  - "s7"
  - "llvm"
# Install settings
apaxVersion: ^4.3.0
# Dependencies
devDependencies:
  "@ax/ax2tia": ^12.3.10
  "@ax/sdk": ^2510.17.0
  "@simatic-ax/mocks": ^4.3.3
dependencies:
  "@ax/system-timer": ^10.4.66
  "@ax/system-serde": ^10.4.66
catalogs:
  "@ax/simatic-ax": ^2510.17.0
  
variables:
  # an arbitrary directory that can be chosen freely
  PATH_NAME: "./bin/handover-folder"
  # you can change the predefined output path where the TIA Portal library will be generated
  TIA_GLOBAL_LIB_PATH: "./lstream-tiax"
  # set the path to your local TIA Portal installation
  TIA_INSTALL_PATH: "C:\\Program Files\\Siemens\\Automation\\Portal V19"
  # remove, if you do not want to allow debugging of your code
  APAX_BUILD_ARGS:
    - "--debug"
    - --generate-runtime-checks
# Apax scripts
scripts:
  # transfer a AX Library to handover library documents for a TIA Library
  export-tia-handover-documents: ax2tia -i ./bin/s7/*.lib -o "$PATH_NAME"
  # convert library handover documents into a global library for the TIA Portal.
  import-handover-documents-to-tia: '"$TIA_INSTALL_PATH\\bin\\Siemens.Simatic.Lang.Library.Importer.exe" -i "$PATH_NAME" -o "$TIA_GLOBAL_LIB_PATH" -u'
  create-tialib:
    - apax build
    - apax export-tia-handover-documents
    - apax import-handover-documents-to-tia

# Files, which will be shipped with the library
files:
  - './README.md'
  - './LICENSE.md'
  - './docs'
  - './src'

# Registries 
registries:
  '@simatic-ax': 'https://npm.pkg.github.com/'
